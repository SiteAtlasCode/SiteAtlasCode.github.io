  <style>
    :root{
      --ax9-bg: #030406;
      --ax9-text: #ffffff;
      --ax9-muted: rgba(255,255,255,0.76);
      --ax9-accent: #ff2b4d;
      --ax9-accent-soft: rgba(255,43,77,0.10);
      --ax9-accent-line: rgba(255,43,77,0.22);
      --ax9-line: rgba(255,255,255,0.08);
      --ax9-soft: rgba(255,255,255,0.04);
      --ax9-shadow: rgba(0,0,0,0.68);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body{
      margin: 0;
      overflow: hidden;
      background: var(--ax9-bg);
      color: var(--ax9-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a,
    a:visited,
    a:hover,
    a:active,
    a:focus{
      color: inherit;
      text-decoration: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .ax9-shell{
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 36%, rgba(255,43,77,0.22), transparent 20%),
        radial-gradient(circle at 72% 18%, rgba(255,255,255,0.05), transparent 14%),
        radial-gradient(circle at 20% 78%, rgba(255,43,77,0.08), transparent 18%),
        linear-gradient(180deg, #06080d 0%, #030406 52%, #020305 100%);
    }

    .ax9-shell::before{
      content: "";
      position: absolute;
      inset: -16%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 44%),
        radial-gradient(circle at 18% 82%, rgba(255,43,77,0.10), transparent 17%),
        radial-gradient(circle at 84% 68%, rgba(255,255,255,0.03), transparent 15%);
      animation: ax9-drift 11s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    .ax9-shell::after{
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 100% 6px, 76px 100%;
      opacity: 0.10;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 1;
      animation: ax9-gridMove 9s linear infinite;
    }

    .ax9-scanline{
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.08), transparent);
      background-size: 100% 14px;
      opacity: 0.10;
      animation: ax9-scan 2.15s linear infinite;
    }

    .ax9-noise{
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.045;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.85) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 42%, rgba(255,255,255,0.65) 0 1px, transparent 1px),
        radial-gradient(circle at 36% 80%, rgba(255,255,255,0.75) 0 1px, transparent 1px);
      background-size: 180px 180px, 220px 220px, 260px 260px;
      animation: ax9-noiseMove 13s linear infinite;
    }

    .ax9-flicker{
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: rgba(255,255,255,0.015);
      animation: ax9-flicker 4.8s infinite steps(1, end);
    }

    .ax9-sparks{
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      overflow: hidden;
      mask-image: radial-gradient(circle at center, #000 0 56%, transparent 83%);
    }

    .ax9-spark{
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 10px rgba(255,43,77,0.68);
      opacity: 0;
      animation: ax9-spark 3.2s linear infinite;
    }

    .ax9-content{
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 22px);
    }

    .ax9-hero{
      width: min(1040px, 100%);
      text-align: center;
      padding: clamp(14px, 4vw, 38px);
      position: relative;
    }

    .ax9-frame{
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0.92;
    }

    .ax9-frame::before,
    .ax9-frame::after{
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 22px;
      border: 1px solid rgba(255,43,77,0.10);
      mask: linear-gradient(#000, transparent 84%);
    }

    .ax9-frame::after{
      inset: 28px;
      border-color: rgba(255,255,255,0.06);
      mask: linear-gradient(transparent 12%, #000 56%, transparent 100%);
    }

    .ax9-heroBand{
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,43,77,0.90), rgba(255,255,255,0.20), transparent);
      box-shadow: 0 0 18px rgba(255,43,77,0.15);
    }

    .ax9-heroBand--top{
      top: 12%;
      width: min(88vw, 780px);
      height: 2px;
      animation: ax9-pulseLine 1.45s ease-in-out infinite;
    }

    .ax9-heroBand--bottom{
      bottom: 12%;
      width: min(84vw, 640px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.58), transparent);
      opacity: 0.50;
      animation: ax9-pulseLine 2.1s ease-in-out infinite reverse;
    }

    .ax9-coreGlow{
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(54vw, 760px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,43,77,0.16), rgba(255,43,77,0.05) 38%, transparent 70%);
      opacity: 0.96;
      pointer-events: none;
      z-index: 5;
      animation: ax9-corePulse 2.5s ease-in-out infinite;
    }

    .ax9-coreGlow::before,
    .ax9-coreGlow::after{
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      animation: ax9-ring 4.6s ease-in-out infinite;
    }

    .ax9-coreGlow::after{
      inset: 10%;
      border-color: rgba(255,255,255,0.06);
      animation-duration: 6.1s;
    }

    .ax9-hero::before,
    .ax9-hero::after{
      content: "";
      position: absolute;
      top: 50%;
      width: 10vw;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.34), transparent);
      pointer-events: none;
      opacity: 0.50;
    }

    .ax9-hero::before{
      right: 0;
      transform: translateY(-50%) skewX(-16deg);
    }

    .ax9-hero::after{
      left: 0;
      transform: translateY(-50%) skewX(16deg);
    }

    .ax9-title{
      position: relative;
      margin: 0;
      display: inline-block;
      font-size: clamp(2.65rem, 9.2vw, 8rem);
      line-height: 0.88;
      letter-spacing: -0.11em;
      text-transform: uppercase;
      font-weight: 950;
      text-shadow: 0 0 20px rgba(0,0,0,0.72);
      transform: translateZ(0);
      animation: ax9-titlePulse 1.55s ease-in-out infinite, ax9-titleTilt 4.8s ease-in-out infinite;
      max-width: 100%;
      word-break: keep-all;
    }

    .ax9-title span{
      color: var(--ax9-accent);
      text-shadow: 0 0 18px rgba(255, 43, 77, 0.96), 0 0 56px rgba(255, 43, 77, 0.16);
    }

    .ax9-title--glitch::before,
    .ax9-title--glitch::after{
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.95;
    }

    .ax9-title--glitch::before{
      color: rgba(255,255,255,0.96);
      transform: translate(1px, 0);
      clip-path: inset(0 0 58% 0);
      animation: ax9-glitch1 0.9s infinite linear alternate-reverse;
    }

    .ax9-title--glitch::after{
      color: var(--ax9-accent);
      transform: translate(-1px, 0);
      clip-path: inset(48% 0 0 0);
      animation: ax9-glitch2 1.03s infinite linear alternate-reverse;
    }

    .ax9-subtitle{
      margin: 18px auto 0;
      max-width: 58ch;
      font-size: clamp(0.95rem, 1.7vw, 1.06rem);
      line-height: 1.9;
      color: var(--ax9-muted);
      letter-spacing: 0.01em;
      padding-inline: 4px;
    }

    .ax9-chips{
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding-inline: 8px;
    }

    .ax9-chip{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--ax9-line);
      color: rgba(255,255,255,0.88);
      font-size: 0.84rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }

    .ax9-chip:hover{
      transform: translateY(-1px);
    }

    .ax9-chip--red{
      background: rgba(255,43,77,0.10);
      border-color: rgba(255,43,77,0.22);
      color: #ffe5eb;
    }

    .ax9-chip--gray{
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.09);
      color: #e8ebf0;
    }

    .ax9-signature{
      position: absolute;
      left: 18px;
      bottom: 16px;
      z-index: 12;
      font-size: 0.74rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.40);
      user-select: none;
      pointer-events: none;
    }

    @keyframes ax9-drift{
      0%   { transform: translate3d(0,0,0) scale(1); }
      50%  { transform: translate3d(-1.8%, 1%, 0) scale(1.025); }
      100% { transform: translate3d(0,0,0) scale(1); }
    }

    @keyframes ax9-gridMove{
      from { transform: translate3d(0,0,0); }
      to   { transform: translate3d(0, 48px, 0); }
    }

    @keyframes ax9-scan{
      from { transform: translateY(-100%); }
      to   { transform: translateY(100%); }
    }

    @keyframes ax9-noiseMove{
      from { transform: translate3d(0,0,0); }
      to   { transform: translate3d(-140px, 90px, 0); }
    }

    @keyframes ax9-flicker{
      0%, 91%, 100% { opacity: 0; }
      92% { opacity: 0.08; }
      94% { opacity: 0.02; }
      95% { opacity: 0.12; }
      97% { opacity: 0; }
      98% { opacity: 0.05; }
      99% { opacity: 0; }
    }

    @keyframes ax9-spark{
      0%   { transform: translate3d(0, 18vh, 0) scale(0.7); opacity: 0; }
      8%   { opacity: 0.9; }
      50%  { opacity: 0.38; }
      100% { transform: translate3d(var(--dx), -120vh, 0) scale(1.12); opacity: 0; }
    }

    @keyframes ax9-pulseLine{
      0%, 100% { transform: translateX(-50%) scaleX(0.86); opacity: 0.42; }
      50% { transform: translateX(-50%) scaleX(1.02); opacity: 1; }
    }

    @keyframes ax9-corePulse{
      0%, 100% { transform: translate(-50%, -50%) scale(0.96); opacity: 0.74; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
    }

    @keyframes ax9-ring{
      0%, 100% { transform: scale(0.94); opacity: 0.22; }
      50% { transform: scale(1.04); opacity: 0.50; }
    }

    @keyframes ax9-titlePulse{
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.014); }
    }

    @keyframes ax9-titleTilt{
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-0.15deg) translateY(-1px); }
    }

    @keyframes ax9-glitch1{
      0%, 100% { transform: translate(1px, 0); }
      12% { transform: translate(-4px, -1px); }
      24% { transform: translate(3px, 1px); }
      36% { transform: translate(-2px, 0); }
      48% { transform: translate(4px, -1px); }
      60% { transform: translate(-3px, 1px); }
      72% { transform: translate(2px, 0); }
      84% { transform: translate(-1px, -1px); }
    }

    @keyframes ax9-glitch2{
      0%, 100% { transform: translate(-1px, 0); }
      12% { transform: translate(3px, 1px); }
      24% { transform: translate(-4px, -1px); }
      36% { transform: translate(4px, 0); }
      48% { transform: translate(-2px, 1px); }
      60% { transform: translate(2px, 0); }
      72% { transform: translate(-3px, -1px); }
      84% { transform: translate(1px, 1px); }
    }

    @media (max-width: 700px){
      .ax9-hero{
        padding: 12px;
      }

      .ax9-title{
        font-size: clamp(2.35rem, 14vw, 4.9rem);
        letter-spacing: -0.09em;
      }

      .ax9-subtitle{
        line-height: 1.76;
        margin-top: 14px;
        font-size: 0.93rem;
      }

      .ax9-signature{
        left: 14px;
        bottom: 12px;
        font-size: 0.68rem;
      }

      .ax9-chips{
        gap: 8px;
        margin-top: 14px;
      }

      .ax9-chip{
        padding: 9px 12px;
        font-size: 0.74rem;
      }

      .ax9-coreGlow{
        width: 84vw;
      }

      .ax9-hero::before,
      .ax9-hero::after{
        width: 14vw;
      }

      .ax9-frame{
        border-radius: 22px;
      }

      .ax9-frame::before{
        inset: 10px;
      }

      .ax9-frame::after{
        inset: 20px;
      }
    }

    @media (max-width: 420px){
      .ax9-title{
        font-size: clamp(2.05rem, 16vw, 3.7rem);
        line-height: 0.92;
      }

      .ax9-subtitle{
        max-width: 34ch;
      }

      .ax9-chip{
        width: auto;
        min-width: 96px;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce){
      *,
      *::before,
      *::after{
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <section class="ax9-shell" id="stage" aria-label="Cyber hero page">
    <div class="ax9-coreGlow"></div>
    <div class="ax9-heroBand ax9-heroBand--top"></div>
    <div class="ax9-heroBand ax9-heroBand--bottom"></div>
    <div class="ax9-scanline"></div>
    <div class="ax9-noise"></div>
    <div class="ax9-flicker"></div>
    <div class="ax9-sparks" id="sparks"></div>

    <div class="ax9-content">
      <div class="ax9-hero">
        <div class="ax9-frame"></div>

        <a href="https://SiteAtlasCode.github.io">
          <h1 class="ax9-title ax9-title--glitch" id="title" data-text="ATLAS CODE">
            ATLAS <span>CODE</span>
          </h1>
        </a>

        <p class="ax9-subtitle">
          متن نمونه
        </p>

        <div class="ax9-chips">
          <a href="https://SiteAtlasCode.github.io/tools" id="themeBtn" class="ax9-chip ax9-chip--red">tools</a>
          <a href="https://SiteAtlasCode.github.io/archive" class="ax9-chip ax9-chip--gray">archive</a>
          <a href="https://SiteAtlasCode.github.io/news" class="ax9-chip ax9-chip--red">news</a>
        </div>
      </div>
    </div>

    <div class="ax9-signature">Atlas Code</div>
  </section>

  <script src="https://siteatlascode.github.io/ui.js"></script>
  <script src="https://siteatlascode.github.io/config.js"></script>
  <script src="https://siteatlascode.github.io/tools.js"></script>
</body>
</html>
